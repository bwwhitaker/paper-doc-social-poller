name: poll-tiktok

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and print only, don't write a snapshot
        type: boolean
        default: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/paper-doc-social-poller ${{ inputs.dry_run && '-dry-run' || '' }}
        env:
          # Use Supabase's pooler (IPv4) connection string here.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
